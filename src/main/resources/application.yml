server:
  servlet:
    context-path: /aws-integrations/api

logging:
  level:
    com.aws: ${LOG_LEVEL:DEBUG}

spring:
  profiles:
    active: ${APP_PROFILE:local}
  cloud:
    aws:
      credentials:
        access-key: ${AWS_SNS_ACCESS_KEY:test}
        secret-key: ${AWS_SNS_SECRET_KEY:test}
      sns:
        region: ${AWS_SNS_REGION:us-east-1}
      sqs:
        region: ${AWS_SQS_REGION:us-east-1}

aws:
  topic:
    sns-sqs-flow: ${AWS_TOPIC_SNS_SQS_FLOW:sns-sqs-flow-topic.fifo}
  queue:
    sns-sqs-flow: ${AWS_QUEUE_SNS_SQS_FLOW:sns-sqs-flow-queue.fifo}
